<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Incheon Mobility</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div id="app"></div>

<script>

let currentMode = null;
let currentUser = null;

let users = [];

let reservations = [];

const locations = [
  "인천국제공항",
  "김포공항",
  "회기역",
  "강남역",
  "서울역",
  "잠실역",
  "판교역",
  "부산역",
  "대전역"
];

function renderHome() {

  document.getElementById("app").innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-6">

      <div class="max-w-6xl w-full grid md:grid-cols-2 gap-6">

        <div
          onclick="selectMode('customer')"
          class="bg-white rounded-[32px] p-10 shadow-xl cursor-pointer hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl">
            🧳
          </div>

          <h2 class="text-4xl font-bold mt-6">
            고객용
            <div class="text-sm text-gray-400 mt-2 font-normal">
              客户端
            </div>
          </h2>

          <p class="text-gray-500 mt-3 text-lg">
            공항 픽업 · 실시간 기사 매칭
            <div class="text-sm text-gray-400 mt-1">
              机场接送 · 实时司机匹配
            </div>
          </p>

        </div>

        <div
          onclick="selectMode('driver')"
          class="bg-white rounded-[32px] p-10 shadow-xl cursor-pointer hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl">
            🚖
          </div>

          <h2 class="text-4xl font-bold mt-6">
            기사용
            <div class="text-sm text-gray-400 mt-2 font-normal">
              司机端
            </div>
          </h2>

          <p class="text-gray-500 mt-3 text-lg">
            운행 수익 관리 · 고객 매칭
            <div class="text-sm text-gray-400 mt-1">
              收益管理 · 客户匹配
            </div>
          </p>

        </div>

        <div id="auth-area" class="md:col-span-2"></div>

      </div>

    </div>
  `;
}

function selectMode(mode) {

  currentMode = mode;

  document.getElementById("auth-area").innerHTML = `
    <div class="bg-white rounded-[32px] shadow-xl p-10">

      <h2 class="text-3xl font-bold mb-8">
        ${
          mode === "customer"
          ? `
            고객 로그인
            <div class="text-sm text-gray-400 mt-2 font-normal">
              客户登录
            </div>
          `
          : `
            기사 로그인
            <div class="text-sm text-gray-400 mt-2 font-normal">
              司机登录
            </div>
          `
        }
      </h2>

      <div class="space-y-4">

        <input
          id="login-id"
          placeholder="아이디 / 账号"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="login-password"
          type="password"
          placeholder="비밀번호 / 密码"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <button
          onclick="login()"
          class="w-full bg-black text-white py-4 rounded-2xl font-bold"
        >
          로그인
          <div class="text-xs text-gray-300 font-normal">
            登录
          </div>
        </button>

        <button
          onclick="showSignup()"
          class="w-full border border-black py-4 rounded-2xl font-bold"
        >
          회원가입
          <div class="text-xs text-gray-400 font-normal">
            注册
          </div>
        </button>

      </div>

    </div>
  `;
}

function showSignup() {

  document.getElementById("auth-area").innerHTML += `
    <div class="bg-white rounded-[32px] shadow-xl p-10 mt-6">

      <h2 class="text-3xl font-bold mb-8">
        회원가입
        <div class="text-sm text-gray-400 mt-2 font-normal">
          注册
        </div>
      </h2>

      <div class="space-y-4">

        <input
          id="signup-id"
          placeholder="아이디 / 账号"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-password"
          type="password"
          placeholder="비밀번호 / 密码"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-name"
          placeholder="이름 / 姓名"
          class="w-full border rounded-2xl px-5 py-4"
        >

        ${
          currentMode === "driver"
          ? `
            <input
              id="signup-car"
              placeholder="차종 / 车型"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-car-number"
              placeholder="차량 번호 / 车牌号码"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-driver-image"
              placeholder="프로필 사진 URL"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <textarea
              id="signup-driver-intro"
              placeholder="기사 소개글"
              class="w-full border rounded-2xl px-5 py-4 h-32"
            ></textarea>
          `
          : ""
        }

        <button
          onclick="signup()"
          class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold"
        >
          회원가입 완료
        </button>

      </div>

    </div>
  `;
}

function signup() {

  users.push({

    id:
      document.getElementById("signup-id").value,

    password:
      document.getElementById("signup-password").value,

    name:
      document.getElementById("signup-name").value,

    type:
      currentMode,

    car:
      document.getElementById("signup-car")
      ? document.getElementById("signup-car").value
      : "",

    carNumber:
      document.getElementById("signup-car-number")
      ? document.getElementById("signup-car-number").value
      : "",

    driverImage:
      document.getElementById("signup-driver-image")
      ? document.getElementById("signup-driver-image").value
      : "",

    driverIntro:
      document.getElementById("signup-driver-intro")
      ? document.getElementById("signup-driver-intro").value
      : "",

    rating: 5,

    income: 0,

    reviews: []

  });

  currentUser =
    users[users.length - 1];

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function login() {

  const id =
    document.getElementById("login-id").value;

  const password =
    document.getElementById("login-password").value;

  const matched =
    users.find(
      user =>
        user.id === id &&
        user.password === password &&
        user.type === currentMode
    );

  if (!matched) {

    alert("계정이 없습니다.");

    return;
  }

  currentUser = matched;

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function showSuggestions(type) {

  const value =
    document.getElementById(type).value.toLowerCase();

  const list =
    document.getElementById(type + "-list");

  const matched =
    locations.filter(location =>
      location.toLowerCase().includes(value)
    );

  list.innerHTML =
    matched.map(location => `
      <div
        onclick="selectLocation('${type}','${location}')"
        class="px-4 py-3 hover:bg-gray-100 cursor-pointer"
      >
        📍 ${location}
      </div>
    `).join("");
}

function selectLocation(type, location) {

  document.getElementById(type).value =
    location;

  document.getElementById(type + "-list").innerHTML =
    "";
}

function reserveRide(driverName = null) {

  const departure =
    document.getElementById("departure").value;

  const destination =
    document.getElementById("destination").value;

  const date =
    document.getElementById("ride-date").value;

  const time =
    document.getElementById("ride-time").value;

  if (!departure || !destination || !date || !time) {

    alert("출발지, 목적지, 날짜, 시간을 입력해주세요.");

    return;
  }

  reservations.push({

    id: Date.now(),

    customer:
      currentUser.name,

    departure,

    destination,

    date,

    time,

    targetDriver:
      driverName,

    estimatedPrice:
      Math.floor(Math.random() * 50000) + 30000,

    offers: [],

    matched: false,

    completed: false,

    customerReview: "",

    driverReview: "",

    customerRating: 0,

    driverRating: 0

  });

  alert("예약 요청 완료!");

  renderCustomer();
}

function submitOffer(reservationId) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  const price =
    document.getElementById(
      "offer-" + reservationId
    ).value;

  reservation.offers.push({

    driver:
      currentUser.name,

    price

  });

  alert("제안 완료!");

  renderDriver();
}

function acceptOffer(reservationId, driverName) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.matched = true;

  reservation.selectedDriver = driverName;

  const driver =
    users.find(
      user => user.name === driverName
    );

  driver.income +=
    Number(reservation.estimatedPrice);

  renderCustomer();
}

function completeRide(reservationId) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.completed = true;

  renderCustomer();
}

function submitCustomerReview(reservationId) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.customerReview =
    document.getElementById(
      "customer-review-" + reservationId
    ).value;

  reservation.customerRating =
    document.getElementById(
      "customer-rating-" + reservationId
    ).value;

  renderCustomer();
}

function submitDriverReview(reservationId) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.driverReview =
    document.getElementById(
      "driver-review-" + reservationId
    ).value;

  reservation.driverRating =
    document.getElementById(
      "driver-rating-" + reservationId
    ).value;

  alert("운행 종료 완료!");

  renderDriver();
}

function renderCustomer() {

  const latestReservation =
    reservations[reservations.length - 1];

  let mapUrl =
    "https://maps.google.com/maps?q=인천국제공항&output=embed";

  if (latestReservation) {

    mapUrl =
      "https://www.google.com/maps/dir/" +
      encodeURIComponent(latestReservation.departure) +
      "/" +
      encodeURIComponent(latestReservation.destination);

  }

  document.getElementById("app").innerHTML = `
    <div class="p-6">

      <div class="max-w-7xl mx-auto bg-white rounded-[32px] shadow-xl p-8">

        <div class="flex justify-between items-center mb-10">

          <div>

            <h1 class="text-5xl font-bold">
              Incheon Mobility
            </h1>

            <p class="text-gray-500 mt-3">
              프리미엄 공항 이동 서비스
              <div class="text-sm text-gray-400">
                高级机场出行服务
              </div>
            </p>

          </div>

        </div>

        <div class="grid lg:grid-cols-2 gap-8">

          <div class="space-y-6">

            <div class="bg-gray-50 rounded-[28px] p-6">

              <h2 class="text-2xl font-bold mb-5">
                차량 호출
                <div class="text-sm text-gray-400 font-normal">
                  呼叫车辆
                </div>
              </h2>

              <div class="space-y-4">

                <div class="relative">

                  <input
                    id="departure"
                    placeholder="출발지 입력"
                    onkeyup="showSuggestions('departure')"
                    class="w-full border rounded-2xl px-5 py-4"
                  >

                  <div
                    id="departure-list"
                    class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl"
                  ></div>

                </div>

                <div class="relative">

                  <input
                    id="destination"
                    placeholder="목적지 입력"
                    onkeyup="showSuggestions('destination')"
                    class="w-full border rounded-2xl px-5 py-4"
                  >

                  <div
                    id="destination-list"
                    class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl"
                  ></div>

                </div>

                <div class="grid grid-cols-2 gap-4">

                  <input
                    id="ride-date"
                    type="date"
                    class="border rounded-2xl px-5 py-4"
                  >

                  <input
                    id="ride-time"
                    type="time"
                    class="border rounded-2xl px-5 py-4"
                  >

                </div>

                <button
                  onclick="reserveRide()"
                  class="w-full bg-black text-white py-4 rounded-2xl font-bold"
                >
                  전체 기사 호출
                </button>

              </div>

            </div>

            <div class="bg-white border rounded-[28px] p-6">

              <h3 class="text-2xl font-bold mb-6">
                추천 기사님
                <div class="text-sm text-gray-400 font-normal">
                  推荐司机
                </div>
              </h3>

              ${
                users
                  .filter(user => user.type === "driver")
                  .map(driver => `
                    <div class="border rounded-[28px] p-5 mb-5">

                      <div class="flex gap-4">

                        <img
                          src="${
                            driver.driverImage ||
                            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
                          }"
                          class="w-20 h-20 rounded-full object-cover"
                        >

                        <div class="flex-1">

                          <div class="flex items-center gap-2">

                            <p class="font-bold text-xl">
                              ${driver.name}
                            </p>

                            <span class="text-yellow-500">
                              ⭐ ${driver.rating}
                            </span>

                          </div>

                          <p class="text-gray-500 mt-1">
                            ${driver.car}
                            ·
                            ${driver.carNumber}
                          </p>

                          <p class="text-gray-700 mt-3">
                            ${
                              driver.driverIntro ||
                              "안전 운행 보장"
                            }
                          </p>

                          <div class="mt-4 bg-gray-50 rounded-2xl p-3">

                            <p class="text-xs text-gray-400">
                              최근 후기 · 最新评价
                            </p>

                            <p class="text-sm mt-1">
                              ${
                                driver.reviews.length > 0
                                ? driver.reviews[
                                    driver.reviews.length - 1
                                  ]
                                : "친절하시고 운전이 편했어요."
                              }
                            </p>

                          </div>

                          <button
                            onclick="reserveRide('${driver.name}')"
                            class="mt-4 bg-black text-white px-5 py-3 rounded-2xl font-bold"
                          >
                            지정 매칭 요청
                          </button>

                        </div>

                      </div>

                    </div>
                  `).join("")
              }

            </div>

          </div>

          <div class="space-y-6">

            <div class="rounded-[28px] overflow-hidden border h-[500px]">

              <iframe
                src="${mapUrl}"
                class="w-full h-full"
              ></iframe>

            </div>

            ${
              latestReservation
              ? `
                <div class="bg-green-50 border rounded-[28px] p-6">

                  <h3 class="text-2xl font-bold mb-5">
                    기사 제안 목록
                  </h3>

                  ${
                    latestReservation.offers.length > 0
                    ? latestReservation.offers.map(offer => `
                        <div class="bg-white rounded-2xl p-4 mb-4 flex justify-between items-center">

                          <div>

                            <p class="font-bold">
                              ${offer.driver}
                            </p>

                            <p class="text-green-600 font-bold text-2xl mt-1">
                              ₩${Number(
                                offer.price
                              ).toLocaleString()}
                            </p>

                          </div>

                          ${
                            !latestReservation.matched
                            ? `
                              <button
                                onclick="acceptOffer(${latestReservation.id}, '${offer.driver}')"
                                class="bg-green-600 text-white px-5 py-3 rounded-2xl font-bold"
                              >
                                매칭하기
                              </button>
                            `
                            : `
                              <div class="text-green-600 font-bold">
                                매칭 완료
                              </div>
                            `
                          }

                        </div>
                      `).join("")
                    : `
                      <div class="text-gray-500">
                        기사님 제안 기다리는 중...
                      </div>
                    `
                  }

                  ${
                    latestReservation.matched &&
                    !latestReservation.completed
                    ? `
                      <button
                        onclick="completeRide(${latestReservation.id})"
                        class="w-full mt-5 bg-blue-600 text-white py-4 rounded-2xl font-bold"
                      >
                        운행 종료
                      </button>
                    `
                    : ""
                  }

                  ${
                    latestReservation.completed
                    ? `
                      <div class="mt-6 bg-white rounded-2xl p-5">

                        <h4 class="font-bold text-xl mb-4">
                          기사님 평가
                        </h4>

                        <select
                          id="customer-rating-${latestReservation.id}"
                          class="w-full border rounded-2xl px-4 py-3 mb-3"
                        >
                          <option value="5">⭐ 5점</option>
                          <option value="4">⭐ 4점</option>
                          <option value="3">⭐ 3점</option>
                          <option value="2">⭐ 2점</option>
                          <option value="1">⭐ 1점</option>
                        </select>

                        <textarea
                          id="customer-review-${latestReservation.id}"
                          placeholder="후기 작성"
                          class="w-full border rounded-2xl px-4 py-3 h-28"
                        ></textarea>

                        <button
                          onclick="submitCustomerReview(${latestReservation.id})"
                          class="w-full mt-4 bg-black text-white py-4 rounded-2xl font-bold"
                        >
                          후기 등록
                        </button>

                      </div>
                    `
                    : ""
                  }

                </div>
              `
              : ""
            }

          </div>

        </div>

      </div>

    </div>
  `;
}

function renderDriver() {

  const myReservations =
    reservations.filter(
      reservation =>
        reservation.selectedDriver === currentUser.name ||
        reservation.targetDriver === currentUser.name
    );

  document.getElementById("app").innerHTML = `
    <div class="p-6">

      <div class="max-w-7xl mx-auto bg-white rounded-[32px] shadow-xl p-8">

        <div class="flex justify-between items-center mb-10">

          <div>

            <h1 class="text-4xl font-bold">
              기사 대시보드
            </h1>

            <p class="text-gray-500 mt-2">
              Driver Dashboard
            </p>

          </div>

        </div>

        <div class="grid lg:grid-cols-3 gap-6 mb-8">

          <div class="bg-blue-50 rounded-[28px] p-6">

            <p class="text-gray-500">
              총 수익
            </p>

            <h2 class="text-4xl font-bold mt-3">
              ₩${Number(
                currentUser.income
              ).toLocaleString()}
            </h2>

          </div>

          <div class="bg-green-50 rounded-[28px] p-6">

            <p class="text-gray-500">
              이번 달 운행
            </p>

            <h2 class="text-4xl font-bold mt-3">
              ${myReservations.length}건
            </h2>

          </div>

          <div class="bg-yellow-50 rounded-[28px] p-6">

            <p class="text-gray-500">
              평균 별점
            </p>

            <h2 class="text-4xl font-bold mt-3">
              ⭐ ${currentUser.rating}
            </h2>

          </div>

        </div>

        <div class="space-y-5">

          ${
            reservations.length > 0
            ? reservations.map(reservation => `
                <div class="bg-gray-50 rounded-[28px] p-6">

                  <p class="font-bold text-2xl">
                    ${reservation.customer}
                  </p>

                  <p class="mt-3">
                    ${reservation.departure}
                    →
                    ${reservation.destination}
                  </p>

                  <p class="mt-2 text-gray-500">
                    ${reservation.date}
                    ·
                    ${reservation.time}
                  </p>

                  <p class="mt-2 text-green-600 font-bold text-xl">
                    ₩${Number(
                      reservation.estimatedPrice
                    ).toLocaleString()}
                  </p>

                  ${
                    !reservation.matched
                    ? `
                      <input
                        id="offer-${reservation.id}"
                        type="number"
                        placeholder="제안 금액"
                        class="w-full border rounded-2xl px-5 py-4 mt-5"
                      >

                      <button
                        onclick="submitOffer(${reservation.id})"
                        class="w-full mt-4 bg-black text-white py-4 rounded-2xl font-bold"
                      >
                        금액 제안
                      </button>
                    `
                    : `
                      <div class="mt-5 bg-green-100 text-green-700 rounded-2xl p-4 font-bold">
                        매칭 완료
                      </div>
                    `
                  }

                  ${
                    reservation.completed
                    ? `
                      <div class="mt-6 bg-white rounded-2xl p-5">

                        <h4 class="font-bold text-xl mb-4">
                          고객 평가
                        </h4>

                        <select
                          id="driver-rating-${reservation.id}"
                          class="w-full border rounded-2xl px-4 py-3 mb-3"
                        >
                          <option value="5">⭐ 5점</option>
                          <option value="4">⭐ 4점</option>
                          <option value="3">⭐ 3점</option>
                          <option value="2">⭐ 2점</option>
                          <option value="1">⭐ 1점</option>
                        </select>

                        <textarea
                          id="driver-review-${reservation.id}"
                          placeholder="고객 후기 작성"
                          class="w-full border rounded-2xl px-4 py-3 h-28"
                        ></textarea>

                        <button
                          onclick="submitDriverReview(${reservation.id})"
                          class="w-full mt-4 bg-blue-600 text-white py-4 rounded-2xl font-bold"
                        >
                          운행 최종 종료
                        </button>

                      </div>
                    `
                    : ""
                  }

                </div>
              `).join("")
            : `
              <div class="text-gray-400">
                예약 없음
              </div>
            `
          }

        </div>

      </div>

    </div>
  `;
}

function logout() {

  currentMode = null;
  currentUser = null;

  renderHome();
}

renderHome();

</script>

</body>
</html>
