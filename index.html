<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airport Pickup</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-10">

  <div class="max-w-5xl mx-auto">

    <div class="bg-white rounded-3xl shadow-xl p-10">

      <h1 class="text-5xl font-bold mb-4">
        ✈️ Airport Pickup
      </h1>

      <p class="text-gray-500 mb-10">
        인천공항 픽업 서비스 MVP
      </p>

      <div class="grid md:grid-cols-2 gap-6">

        <div class="bg-gray-50 rounded-3xl p-6">
          <h2 class="text-3xl font-bold mb-6">고객용</h2>

          <input
            placeholder="출발지"
            class="w-full border rounded-2xl px-4 py-4 mb-4"
          >

          <input
            placeholder="목적지"
            class="w-full border rounded-2xl px-4 py-4 mb-4"
          >

          <button
            class="w-full bg-black text-white py-4 rounded-2xl font-bold"
          >
            예약하기
          </button>
        </div>

        <div class="bg-gray-50 rounded-3xl p-6">
          <h2 class="text-3xl font-bold mb-6">기사용</h2>

          <div class="bg-white rounded-2xl p-5 mb-4">
            <p class="font-bold">신규 예약 요청</p>

            <p class="text-gray-500 mt-2">
              회기역 → 인천공항
            </p>
          </div>

          <button
            class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold"
          >
            승낙하기
          </button>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
