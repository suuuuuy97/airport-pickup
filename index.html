<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Incheon Mobility</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div id="app"></div>

<script>

let currentMode = null;
let currentUser = null;

let users = [];

let reservations = [];

const locations = [
  "인천국제공항",
  "김포공항",
  "회기역",
  "강남역",
  "서울역",
  "잠실역",
  "판교역",
  "부산역",
  "대전역"
];

function renderHome() {

  document.getElementById("app").innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-6">

      <div class="w-full max-w-6xl grid md:grid-cols-2 gap-6">

        <div
          onclick="selectMode('customer')"
          class="cursor-pointer bg-white rounded-3xl p-10 shadow-xl hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl mb-6">🧳</div>

          <h2 class="text-4xl font-bold">
            고객용
          </h2>

          <p class="text-gray-500 mt-4 text-lg">
            공항 픽업 예약 및 기사 호출
          </p>

        </div>

        <div
          onclick="selectMode('driver')"
          class="cursor-pointer bg-white rounded-3xl p-10 shadow-xl hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl mb-6">🚖</div>

          <h2 class="text-4xl font-bold">
            기사용
          </h2>

          <p class="text-gray-500 mt-4 text-lg">
            운행 관리 및 수익 확인
          </p>

        </div>

        <div id="auth-area" class="md:col-span-2"></div>

      </div>

    </div>
  `;
}

function selectMode(mode) {

  currentMode = mode;

  document.getElementById("auth-area").innerHTML = `
    <div class="bg-white rounded-3xl shadow-2xl p-10 mt-2">

      <h2 class="text-3xl font-bold mb-8">
        ${mode === "customer" ? "고객 로그인" : "기사 로그인"}
      </h2>

      <div class="space-y-4">

        <input
          id="login-id"
          placeholder="아이디"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="login-password"
          type="password"
          placeholder="비밀번호"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <button
          onclick="login()"
          class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg"
        >
          로그인
        </button>

        <button
          onclick="showSignup()"
          class="w-full border border-black py-4 rounded-2xl font-bold text-lg"
        >
          회원가입 하기
        </button>

      </div>

    </div>
  `;
}

function showSignup() {

  document.getElementById("auth-area").innerHTML += `
    <div class="bg-white rounded-3xl shadow-2xl p-10 mt-6">

      <h2 class="text-3xl font-bold mb-8">
        회원가입
      </h2>

      <div class="space-y-4">

        <input
          id="signup-id"
          placeholder="${currentMode === "customer" ? "고객 아이디" : "기사 아이디"}"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-password"
          type="password"
          placeholder="비밀번호"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-name"
          placeholder="${currentMode === "customer" ? "고객 이름" : "기사 이름"}"
          class="w-full border rounded-2xl px-5 py-4"
        >

        ${
          currentMode === "driver"
          ? `
            <input
              id="signup-car"
              placeholder="차종"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-car-number"
              placeholder="차량 번호"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-driver-image"
              placeholder="기사 프로필 사진 URL"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <textarea
              id="signup-driver-intro"
              placeholder="기사 소개글"
              class="w-full border rounded-2xl px-5 py-4 h-32"
            ></textarea>
          `
          : ""
        }

        <button
          onclick="signup()"
          class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg"
        >
          회원가입 완료
        </button>

      </div>

    </div>
  `;
}

function signup() {

  const id =
    document.getElementById("signup-id").value.trim();

  const password =
    document.getElementById("signup-password").value.trim();

  const name =
    document.getElementById("signup-name").value.trim();

  if (!id || !password || !name) {

    alert("모든 항목을 입력해주세요.");

    return;
  }

  const carInput =
    document.getElementById("signup-car");

  const carNumberInput =
    document.getElementById("signup-car-number");

  const driverImageInput =
    document.getElementById("signup-driver-image");

  const driverIntroInput =
    document.getElementById("signup-driver-intro");

  users.push({
    id,
    password,
    name,
    type: currentMode,
    car:
      carInput
      ? carInput.value
      : "",
    carNumber:
      carNumberInput
      ? carNumberInput.value
      : "",
    driverImage:
      driverImageInput
      ? driverImageInput.value
      : "",
    driverIntro:
      driverIntroInput
      ? driverIntroInput.value
      : "",
    rating: 5
  });

  currentUser = {
    id,
    name,
    type: currentMode
  };

  alert("회원가입 완료!");

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function login() {

  const id =
    document.getElementById("login-id").value.trim();

  const password =
    document.getElementById("login-password").value.trim();

  const matched =
    users.find(
      user =>
        user.id === id &&
        user.password === password &&
        user.type === currentMode
    );

  if (!matched) {

    alert("회원가입된 계정만 로그인 가능합니다.");

    return;
  }

  currentUser = matched;

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function showSuggestions(type) {

  const value =
    document.getElementById(type).value.toLowerCase();

  const list =
    document.getElementById(type + "-list");

  if (!value) {

    list.innerHTML = "";

    return;
  }

  const matched =
    locations.filter(location =>
      location.toLowerCase().includes(value)
    );

  list.innerHTML =
    matched.map(location => `
      <div
        onclick="selectLocation('${type}','${location}')"
        class="px-4 py-3 hover:bg-gray-100 cursor-pointer"
      >
        📍 ${location}
      </div>
    `).join("");
}

function selectLocation(type, location) {

  document.getElementById(type).value = location;

  document.getElementById(type + "-list").innerHTML = "";
}

function getEstimatedPrice() {

  return Math.floor(Math.random() * 50000) + 30000;
}

function reserveRide() {

  const departure =
    document.getElementById("departure").value.trim();

  const destination =
    document.getElementById("destination").value.trim();

  if (!departure || !destination) {

    alert("출발지와 목적지를 입력해주세요.");

    return;
  }

  reservations.push({
    id: Date.now(),
    customer: currentUser.name,
    departure,
    destination,
    estimatedPrice: getEstimatedPrice(),
    offers: [],
    matched: false,
    completed: false
  });

  alert("모든 기사에게 예약 요청 완료!");

  renderCustomer();
}

function requestSpecificDriver(driverId) {

  const departure =
    document.getElementById("departure").value.trim();

  const destination =
    document.getElementById("destination").value.trim();

  const customPrice =
    document.getElementById(
      "custom-price-" + driverId
    ).value;

  const customDate =
    document.getElementById(
      "custom-date-" + driverId
    ).value;

  const customTime =
    document.getElementById(
      "custom-time-" + driverId
    ).value;

  const driver =
    users.find(user => user.id === driverId);

  reservations.push({
    id: Date.now(),
    customer: currentUser.name,
    departure,
    destination,
    estimatedPrice:
      customPrice || getEstimatedPrice(),
    date: customDate,
    time: customTime,
    targetDriver: driver.name,
    offers: [],
    matched: false,
    completed: false
  });

  alert(driver.name + " 기사님 지정 요청 완료!");

  renderCustomer();
}

function submitOffer(reservationId, driverName) {

  const input =
    document.getElementById(
      "offer-" + reservationId
    );

  const price = input.value;

  if (!price) {

    alert("금액 입력해주세요.");

    return;
  }

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.offers.push({
    driver: driverName,
    price
  });

  alert("고객에게 제안 완료!");

  renderDriver();
}

function acceptOffer(reservationId, driverName) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.matched = true;

  reservation.selectedDriver = driverName;

  alert(driverName + " 기사님 매칭 완료!");

  renderCustomer();
}

function completeRide(reservationId) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.completed = true;

  alert("운행 완료!");

  renderCustomer();
}

function rateDriver(score) {

  alert(score + "점 평가 완료!");

}

function renderCustomer() {

  const latestReservation =
    reservations[reservations.length - 1];

  let mapUrl =
    "https://maps.google.com/maps?q=인천국제공항&output=embed";

  if (latestReservation) {

    mapUrl =
      "https://www.google.com/maps/dir/" +
      encodeURIComponent(
        latestReservation.departure
      ) +
      "/" +
      encodeURIComponent(
        latestReservation.destination
      );

  }

  document.getElementById("app").innerHTML = `
    <div class="p-6">

      <div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-xl p-8">

        <div class="flex justify-between items-center mb-8">

          <div>

            <h1 class="text-4xl font-bold">
              Incheon Mobility
            </h1>

            <p class="text-gray-500 mt-2">
              공항 · 시내 프리미엄 이동 플랫폼
            </p>

          </div>

          <button
            onclick="logout()"
            class="bg-gray-200 px-5 py-3 rounded-2xl font-bold"
          >
            로그아웃
          </button>

        </div>

        <div class="grid lg:grid-cols-2 gap-6">

          <div class="space-y-5">

            <div class="relative">

              <input
                id="departure"
                placeholder="출발지 입력"
                onkeyup="showSuggestions('departure')"
                class="w-full border rounded-2xl px-5 py-4"
              >

              <div
                id="departure-list"
                class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl overflow-hidden z-20"
              ></div>

            </div>

            <div class="relative">

              <input
                id="destination"
                placeholder="목적지 입력"
                onkeyup="showSuggestions('destination')"
                class="w-full border rounded-2xl px-5 py-4"
              >

              <div
                id="destination-list"
                class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl overflow-hidden z-20"
              ></div>

            </div>

            <button
              onclick="reserveRide()"
              class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg"
            >
              전체 기사 호출
            </button>

            <div class="bg-white border rounded-3xl p-6">

              <div class="flex items-center justify-between mb-6">

                <h3 class="text-2xl font-bold">
                  최고 추천 기사
                </h3>

                <div class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-2xl font-bold">
                  BEST
                </div>

              </div>

              ${
                users
                  .filter(user => user.type === "driver")
                  .map(driver => `
                    <div class="border rounded-3xl p-5 mb-5">

                      <div class="flex items-center gap-4">

                        <img
                          src="${
                            driver.driverImage ||
                            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
                          }"
                          class="w-20 h-20 rounded-full object-cover"
                        >

                        <div class="flex-1">

                          <div class="flex items-center gap-2">

                            <p class="font-bold text-xl">
                              ${driver.name}
                            </p>

                            <span class="text-yellow-500 font-bold">
                              ⭐ ${driver.rating}
                            </span>

                          </div>

                          <p class="text-gray-500 mt-1">
                            ${driver.car}
                            ·
                            ${driver.carNumber}
                          </p>

                          <p class="text-sm text-gray-600 mt-2">
                            ${
                              driver.driverIntro ||
                              "안전 운행 보장"
                            }
                          </p>

                        </div>

                      </div>

                      <div class="grid grid-cols-2 gap-3 mt-5">

                        <input
                          id="custom-date-${driver.id}"
                          type="date"
                          class="border rounded-2xl px-4 py-3"
                        >

                        <input
                          id="custom-time-${driver.id}"
                          type="time"
                          class="border rounded-2xl px-4 py-3"
                        >

                      </div>

                      <input
                        id="custom-price-${driver.id}"
                        type="number"
                        placeholder="희망 금액"
                        class="w-full border rounded-2xl px-4 py-3 mt-3"
                      >

                      <button
                        onclick="requestSpecificDriver('${driver.id}')"
                        class="w-full mt-4 bg-black text-white py-4 rounded-2xl font-bold"
                      >
                        지정 기사 요청
                      </button>

                    </div>
                  `).join("")
              }

            </div>

            ${
              latestReservation
              ? `
                <div class="bg-green-50 border-2 border-green-500 rounded-3xl p-5">

                  <p class="font-bold text-2xl mb-4">
                    기사 제안 목록
                  </p>

                  ${
                    latestReservation.offers.length > 0
                    ? latestReservation.offers.map(offer => `
                        <div class="bg-white rounded-2xl p-4 mb-4 flex justify-between items-center">

                          <div>

                            <p class="font-bold">
                              ${offer.driver}
                            </p>

                            <p class="text-2xl font-bold text-green-600 mt-1">
                              ₩${Number(
                                offer.price
                              ).toLocaleString()}
                            </p>

                          </div>

                          ${
                            !latestReservation.matched
                            ? `
                              <button
                                onclick="acceptOffer(${latestReservation.id},'${offer.driver}')"
                                class="bg-green-600 text-white px-5 py-3 rounded-2xl font-bold"
                              >
                                매칭하기
                              </button>
                            `
                            : `
                              <div class="text-green-600 font-bold">
                                매칭 완료
                              </div>
                            `
                          }

                        </div>
                      `).join("")
                    : `
                      <div class="text-gray-500">
                        기사님 제안 기다리는 중...
                      </div>
                    `
                  }

                  ${
                    latestReservation.matched
                    ? `
                      <button
                        onclick="completeRide(${latestReservation.id})"
                        class="w-full mt-4 bg-blue-600 text-white py-4 rounded-2xl font-bold"
                      >
                        운행 완료
                      </button>
                    `
                    : ""
                  }

                  ${
                    latestReservation.completed
                    ? `
                      <div class="mt-5 bg-yellow-50 border border-yellow-400 rounded-3xl p-5">

                        <p class="font-bold text-xl mb-4">
                          기사 평가하기
                        </p>

                        <div class="flex gap-2 text-4xl">

                          <button onclick="rateDriver(1)">⭐</button>
                          <button onclick="rateDriver(2)">⭐</button>
                          <button onclick="rateDriver(3)">⭐</button>
                          <button onclick="rateDriver(4)">⭐</button>
                          <button onclick="rateDriver(5)">⭐</button>

                        </div>

                      </div>
                    `
                    : ""
                  }

                </div>
              `
              : ""
            }

          </div>

          <div class="rounded-3xl overflow-hidden border h-[700px]">

            <iframe
              src="${mapUrl}"
              class="w-full h-full"
            ></iframe>

          </div>

        </div>

      </div>

    </div>
  `;
}

function renderDriver() {

  document.getElementById("app").innerHTML = `
    <div class="p-6">

      <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-xl p-8">

        <div class="flex justify-between items-center mb-8">

          <h1 class="text-4xl font-bold">
            기사 대시보드
          </h1>

          <button
            onclick="logout()"
            class="bg-gray-200 px-5 py-3 rounded-2xl font-bold"
          >
            로그아웃
          </button>

        </div>

        <div class="space-y-5">

          ${
            reservations.length > 0
            ? reservations.map(reservation => `
                <div class="bg-yellow-50 border-2 border-yellow-400 rounded-3xl p-6">

                  <p class="font-bold text-2xl">
                    ${reservation.customer} 고객
                  </p>

                  <p class="mt-4 text-lg">
                    ${reservation.departure}
                    →
                    ${reservation.destination}
                  </p>

                  <p class="mt-2 text-gray-500">
                    예상 요금:
                    ₩${reservation.estimatedPrice.toLocaleString()}
                  </p>

                  ${
                    reservation.targetDriver
                    ? `
                      <div class="mt-3 bg-blue-50 border border-blue-500 rounded-2xl p-3 text-blue-700 font-bold">
                        지정 호출 요청
                      </div>
                    `
                    : ""
                  }

                  ${
                    !reservation.matched
                    ? `
                      <div class="mt-6">

                        <input
                          id="offer-${reservation.id}"
                          type="number"
                          placeholder="제안 금액"
                          class="w-full border rounded-2xl px-5 py-4"
                        >

                        <button
                          onclick="submitOffer(${reservation.id},'${currentUser.name}')"
                          class="w-full mt-4 bg-black text-white py-4 rounded-2xl font-bold"
                        >
                          금액 제안하기
                        </button>

                      </div>
                    `
                    : `
                      <div class="mt-6 bg-green-50 border border-green-500 rounded-2xl p-4 text-green-700 font-bold">
                        ${reservation.selectedDriver} 기사님 매칭 완료
                      </div>
                    `
                  }

                </div>
              `).join("")
            : `
              <div class="text-gray-400">
                현재 예약 요청 없음
              </div>
            `
          }

        </div>

      </div>

    </div>
  `;
}

function logout() {

  currentMode = null;
  currentUser = null;

  renderHome();
}

renderHome();

</script>

</body>
</html>
