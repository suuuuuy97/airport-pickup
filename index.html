<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Incheon Mobility</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div id="app"></div>

<script>

let currentMode = null;
let currentUser = null;

let users = [];
let reservations = [];

const locations = [
  "인천국제공항",
  "김포공항",
  "강남역",
  "서울역",
  "잠실역",
  "판교역",
  "부산역",
  "대전역"
];

function renderHome() {

  document.getElementById("app").innerHTML = `

    <div class="min-h-screen flex items-center justify-center p-6">

      <div class="max-w-6xl w-full grid md:grid-cols-2 gap-6">

        <div
          onclick="selectMode('customer')"
          class="bg-white rounded-[32px] p-10 shadow-xl cursor-pointer hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl">🧳</div>

          <h2 class="text-4xl font-bold mt-6">
            고객용
            <div class="text-sm text-gray-400 mt-2 font-normal">
              客户端
            </div>
          </h2>

          <p class="text-gray-500 mt-3">
            공항 픽업 · 기사 매칭
          </p>

        </div>

        <div
          onclick="selectMode('driver')"
          class="bg-white rounded-[32px] p-10 shadow-xl cursor-pointer hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl">🚖</div>

          <h2 class="text-4xl font-bold mt-6">
            기사용
            <div class="text-sm text-gray-400 mt-2 font-normal">
              司机端
            </div>
          </h2>

          <p class="text-gray-500 mt-3">
            수익 관리 · 예약 수락
          </p>

        </div>

        <div id="auth-area" class="md:col-span-2"></div>

      </div>

    </div>

  `;
}

function selectMode(mode) {

  currentMode = mode;

  document.getElementById("auth-area").innerHTML = `

    <div class="bg-white rounded-[32px] p-10 shadow-xl">

      <h2 class="text-3xl font-bold mb-8">
        ${mode === "customer" ? "고객 로그인" : "기사 로그인"}
      </h2>

      <div class="space-y-4">

        <input
          id="login-id"
          placeholder="아이디"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="login-password"
          type="password"
          placeholder="비밀번호"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <button
          onclick="login()"
          class="w-full bg-black text-white py-4 rounded-2xl font-bold"
        >
          로그인
        </button>

        <button
          onclick="showSignup()"
          class="w-full border border-black py-4 rounded-2xl font-bold"
        >
          회원가입
        </button>

      </div>

    </div>

  `;
}

function showSignup() {

  document.getElementById("auth-area").innerHTML += `

    <div class="bg-white rounded-[32px] p-10 shadow-xl mt-6">

      <h2 class="text-3xl font-bold mb-8">
        회원가입
      </h2>

      <div class="space-y-4">

        <input
          id="signup-id"
          placeholder="아이디"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-password"
          type="password"
          placeholder="비밀번호"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-name"
          placeholder="이름"
          class="w-full border rounded-2xl px-5 py-4"
        >

        ${
          currentMode === "driver"

          ? `

            <input
              id="signup-car"
              placeholder="차종"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-car-number"
              placeholder="차량번호"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-driver-image"
              placeholder="기사 사진 URL"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <textarea
              id="signup-driver-intro"
              placeholder="기사 소개글"
              class="w-full border rounded-2xl px-5 py-4 h-28"
            ></textarea>

          `

          : ""

        }

        <button
          onclick="signup()"
          class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold"
        >
          회원가입 완료
        </button>

      </div>

    </div>

  `;
}

function signup() {

  users.push({

    id:
      document.getElementById("signup-id").value,

    password:
      document.getElementById("signup-password").value,

    name:
      document.getElementById("signup-name").value,

    type:
      currentMode,

    car:
      document.getElementById("signup-car")
      ? document.getElementById("signup-car").value
      : "",

    carNumber:
      document.getElementById("signup-car-number")
      ? document.getElementById("signup-car-number").value
      : "",

    driverImage:
      document.getElementById("signup-driver-image")
      ? document.getElementById("signup-driver-image").value
      : "",

    driverIntro:
      document.getElementById("signup-driver-intro")
      ? document.getElementById("signup-driver-intro").value
      : "",

    income: 0,

    rating: 5,

    reviews: []

  });

  currentUser =
    users[users.length - 1];

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function login() {

  const matched =
    users.find(
      user =>
        user.id ===
          document.getElementById("login-id").value &&
        user.password ===
          document.getElementById("login-password").value &&
        user.type === currentMode
    );

  if (!matched) {

    alert("로그인 실패");

    return;
  }

  currentUser = matched;

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function showSuggestions(type) {

  const value =
    document.getElementById(type).value.toLowerCase();

  const list =
    document.getElementById(type + "-list");

  const matched =
    locations.filter(location =>
      location.toLowerCase().includes(value)
    );

  list.innerHTML =
    matched.map(location => `
      <div
        onclick="selectLocation('${type}','${location}')"
        class="px-4 py-3 hover:bg-gray-100 cursor-pointer"
      >
        📍 ${location}
      </div>
    `).join("");
}

function selectLocation(type, location) {

  document.getElementById(type).value =
    location;

  document.getElementById(type + "-list").innerHTML =
    "";
}

function reserveRide(targetDriver = null) {

  const departure =
    document.getElementById("departure").value;

  const destination =
    document.getElementById("destination").value;

  const date =
    document.getElementById("ride-date").value;

  const time =
    document.getElementById("ride-time").value;

  if (!departure || !destination || !date || !time) {

    alert("모든 항목 입력");

    return;
  }

  reservations.push({

    id: Date.now(),

    customer:
      currentUser.name,

    departure,

    destination,

    date,

    time,

    targetDriver,

    estimatedPrice:
      Math.floor(Math.random() * 50000) + 30000,

    offers: [],

    matched: false,

    selectedDriver: null,

    completed: false

  });

  alert("예약 완료!");

  renderCustomer();
}

function submitOffer(reservationId) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.offers.push({

    driver:
      currentUser.name,

    price:
      document.getElementById(
        "offer-" + reservationId
      ).value

  });

  alert("제안 완료!");

  renderDriver();
  renderCustomer();
}

function acceptOffer(reservationId, driverName) {

  const reservation =
    reservations.find(r => r.id === reservationId);

  reservation.matched = true;

  reservation.selectedDriver = driverName;

  const driver =
    users.find(
      user => user.name === driverName
    );

  driver.income +=
    Number(reservation.estimatedPrice);

  renderCustomer();
}

function renderCustomer() {

  const latestReservation =
    reservations[reservations.length - 1];

  let mapUrl =
    "https://maps.google.com/maps?q=인천국제공항&output=embed";

  if (latestReservation) {

    mapUrl =
      "https://www.google.com/maps/dir/" +
      encodeURIComponent(latestReservation.departure) +
      "/" +
      encodeURIComponent(latestReservation.destination);

  }

  document.getElementById("app").innerHTML = `

    <div class="p-6">

      <div class="max-w-7xl mx-auto bg-white rounded-[32px] shadow-xl p-8">

        <h1 class="text-5xl font-bold mb-10">
          Incheon Mobility
        </h1>

        <div class="grid lg:grid-cols-2 gap-8">

          <div class="space-y-6">

            <div class="bg-gray-50 rounded-[28px] p-6">

              <div class="space-y-4">

                <div class="relative">

                  <input
                    id="departure"
                    placeholder="출발지"
                    onkeyup="showSuggestions('departure')"
                    class="w-full border rounded-2xl px-5 py-4"
                  >

                  <div
                    id="departure-list"
                    class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl"
                  ></div>

                </div>

                <div class="relative">

                  <input
                    id="destination"
                    placeholder="목적지"
                    onkeyup="showSuggestions('destination')"
                    class="w-full border rounded-2xl px-5 py-4"
                  >

                  <div
                    id="destination-list"
                    class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl"
                  ></div>

                </div>

                <div class="grid grid-cols-2 gap-4">

                  <input
                    id="ride-date"
                    type="date"
                    class="border rounded-2xl px-5 py-4"
                  >

                  <input
                    id="ride-time"
                    type="time"
                    class="border rounded-2xl px-5 py-4"
                  >

                </div>

                <button
                  onclick="reserveRide()"
                  class="w-full bg-black text-white py-4 rounded-2xl font-bold"
                >
                  전체 기사 호출
                </button>

              </div>

            </div>

            <div class="bg-white border rounded-[28px] p-6">

              <h3 class="text-2xl font-bold mb-6">
                추천 기사님
              </h3>

              ${
                users
                  .filter(user => user.type === "driver")
                  .map(driver => `
                    <div class="border rounded-[28px] p-5 mb-5">

                      <div class="flex gap-4">

                        <img
                          src="${
                            driver.driverImage ||
                            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
                          }"
                          class="w-20 h-20 rounded-full object-cover"
                        >

                        <div class="flex-1">

                          <p class="font-bold text-xl">
                            ${driver.name}
                          </p>

                          <p class="text-gray-500 mt-1">
                            ${driver.car}
                            ·
                            ${driver.carNumber}
                          </p>

                          <p class="text-gray-700 mt-3">
                            ${
                              driver.driverIntro ||
                              "안전 운행 보장"
                            }
                          </p>

                          <button
                            onclick="reserveRide('${driver.name}')"
                            class="mt-4 bg-black text-white px-5 py-3 rounded-2xl font-bold"
                          >
                            지정 기사 요청
                          </button>

                        </div>

                      </div>

                    </div>
                  `).join("")
              }

            </div>

          </div>

          <div class="space-y-6">

            <div class="rounded-[28px] overflow-hidden border h-[500px]">

              <iframe
                src="${mapUrl}"
                class="w-full h-full"
              ></iframe>

            </div>

            ${
              latestReservation
              ? `
                <div class="bg-green-50 border rounded-[28px] p-6">

                  <h3 class="text-2xl font-bold mb-5">
                    기사 제안 목록
                  </h3>

                  ${
                    latestReservation.offers.length > 0
                    ? latestReservation.offers.map(offer => `
                        <div class="bg-white rounded-2xl p-4 mb-4 flex justify-between items-center">

                          <div>

                            <p class="font-bold">
                              ${offer.driver}
                            </p>

                            <p class="text-green-600 font-bold text-2xl mt-1">
                              ₩${Number(
                                offer.price
                              ).toLocaleString()}
                            </p>

                          </div>

                          ${
                            !latestReservation.matched
                            ? `
                              <button
                                onclick="acceptOffer(${latestReservation.id}, '${offer.driver}')"
                                class="bg-green-600 text-white px-5 py-3 rounded-2xl font-bold"
                              >
                                매칭하기
                              </button>
                            `
                            : `
                              <div class="text-green-600 font-bold">
                                매칭 완료
                              </div>
                            `
                          }

                        </div>
                      `).join("")
                    : `
                      <div class="text-gray-500">
                        기사님 제안 대기중
                      </div>
                    `
                  }

                </div>
              `
              : ""
            }

          </div>

        </div>

      </div>

    </div>

  `;
}

function renderDriver() {

  const openReservations =
    reservations.filter(
      reservation =>

        !reservation.matched &&

        (
          !reservation.targetDriver ||

          reservation.targetDriver === currentUser.name
        )
    );

  document.getElementById("app").innerHTML = `

    <div class="p-6">

      <div class="max-w-6xl mx-auto bg-white rounded-[32px] shadow-xl p-8">

        <h1 class="text-4xl font-bold mb-10">
          기사 대시보드
        </h1>

        <div class="grid grid-cols-3 gap-5 mb-8">

          <div class="bg-blue-50 rounded-[28px] p-6">

            <p class="text-gray-500">
              총 수익
            </p>

            <h2 class="text-4xl font-bold mt-3">
              ₩${Number(
                currentUser.income || 0
              ).toLocaleString()}
            </h2>

          </div>

          <div class="bg-green-50 rounded-[28px] p-6">

            <p class="text-gray-500">
              완료 운행
            </p>

            <h2 class="text-4xl font-bold mt-3">
              ${
                reservations.filter(
                  r =>
                    r.selectedDriver === currentUser.name
                ).length
              }건
            </h2>

          </div>

          <div class="bg-yellow-50 rounded-[28px] p-6">

            <p class="text-gray-500">
              평균 평점
            </p>

            <h2 class="text-4xl font-bold mt-3">
              ⭐ ${currentUser.rating || 5}
            </h2>

          </div>

        </div>

        <h2 class="text-2xl font-bold mb-6">
          고객 요청 리스트
        </h2>

        <div class="space-y-5">

          ${
            openReservations.length > 0

            ? openReservations.map(reservation => `

              <div class="bg-gray-50 rounded-[28px] p-6 border">

                <p class="font-bold text-2xl">
                  ${reservation.customer}
                </p>

                <p class="mt-4 text-lg">
                  ${reservation.departure}
                  →
                  ${reservation.destination}
                </p>

                <p class="mt-2 text-gray-500">
                  ${reservation.date}
                  ·
                  ${reservation.time}
                </p>

                <p class="mt-3 text-green-600 font-bold text-2xl">
                  예상요금
                  ₩${Number(
                    reservation.estimatedPrice
                  ).toLocaleString()}
                </p>

                ${
                  reservation.targetDriver

                  ? `
                    <div class="mt-4 bg-blue-100 text-blue-700 px-4 py-2 rounded-2xl inline-block font-bold">
                      지정 기사 요청
                    </div>
                  `

                  : ""
                }

                <div class="mt-6">

                  <input
                    id="offer-${reservation.id}"
                    type="number"
                    placeholder="제안 금액 입력"
                    class="w-full border rounded-2xl px-5 py-4"
                  >

                  <button
                    onclick="submitOffer(${reservation.id})"
                    class="w-full mt-4 bg-black text-white py-4 rounded-2xl font-bold"
                  >
                    금액 제안하기
                  </button>

                </div>

              </div>

            `).join("")

            : `

              <div class="bg-gray-50 rounded-[28px] p-10 text-center text-gray-400 text-lg">

                현재 들어온 고객 요청이 없습니다.

              </div>

            `
          }

        </div>

      </div>

    </div>

  `;
}

setInterval(() => {

  if (
    currentMode === "driver" &&
    currentUser
  ) {

    renderDriver();

  }

}, 2000);

renderHome();

</script>

</body>
</html>
