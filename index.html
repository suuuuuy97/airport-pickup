<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Incheon Mobility</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div id="app"></div>

<script>

let currentMode = null;
let currentUser = null;

let users = [];
let reservations = [];

const locations = [
  "인천국제공항",
  "김포공항",
  "회기역",
  "강남역",
  "서울역",
  "잠실역",
  "판교역",
  "부산역",
  "대전역"
];

function renderHome() {

  document.getElementById("app").innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-6">

      <div class="max-w-6xl w-full grid md:grid-cols-2 gap-6">

        <div
          onclick="selectMode('customer')"
          class="bg-white rounded-[32px] p-10 shadow-xl cursor-pointer hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl">
            🧳
          </div>

          <h2 class="text-4xl font-bold mt-6">
            고객용
            <div class="text-sm text-gray-400 mt-2 font-normal">
              客户端
            </div>
          </h2>

          <p class="text-gray-500 mt-3 text-lg">
            공항 픽업 · 실시간 기사 매칭
            <div class="text-sm text-gray-400 mt-1">
              机场接送 · 实时司机匹配
            </div>
          </p>

        </div>

        <div
          onclick="selectMode('driver')"
          class="bg-white rounded-[32px] p-10 shadow-xl cursor-pointer hover:scale-[1.02] transition-all"
        >

          <div class="text-7xl">
            🚖
          </div>

          <h2 class="text-4xl font-bold mt-6">
            기사용
            <div class="text-sm text-gray-400 mt-2 font-normal">
              司机端
            </div>
          </h2>

          <p class="text-gray-500 mt-3 text-lg">
            운행 수익 관리 · 고객 매칭
            <div class="text-sm text-gray-400 mt-1">
              收益管理 · 客户匹配
            </div>
          </p>

        </div>

        <div id="auth-area" class="md:col-span-2"></div>

      </div>

    </div>
  `;
}

function selectMode(mode) {

  currentMode = mode;

  document.getElementById("auth-area").innerHTML = `
    <div class="bg-white rounded-[32px] shadow-xl p-10">

      <h2 class="text-3xl font-bold mb-8">
        ${mode === "customer"
          ? `
            고객 로그인
            <div class="text-sm text-gray-400 mt-2 font-normal">
              客户登录
            </div>
          `
          : `
            기사 로그인
            <div class="text-sm text-gray-400 mt-2 font-normal">
              司机登录
            </div>
          `
        }
      </h2>

      <div class="space-y-4">

        <input
          id="login-id"
          placeholder="아이디 / 账号"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="login-password"
          type="password"
          placeholder="비밀번호 / 密码"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <button
          onclick="login()"
          class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg"
        >
          로그인
          <div class="text-xs text-gray-300 font-normal">
            登录
          </div>
        </button>

        <button
          onclick="showSignup()"
          class="w-full border border-black py-4 rounded-2xl font-bold text-lg"
        >
          회원가입 하기
          <div class="text-xs text-gray-400 font-normal">
            注册账号
          </div>
        </button>

      </div>

    </div>
  `;
}

function showSignup() {

  document.getElementById("auth-area").innerHTML += `
    <div class="bg-white rounded-[32px] shadow-xl p-10 mt-6">

      <h2 class="text-3xl font-bold mb-8">
        회원가입
        <div class="text-sm text-gray-400 mt-2 font-normal">
          注册
        </div>
      </h2>

      <div class="space-y-4">

        <input
          id="signup-id"
          placeholder="아이디 / 账号"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-password"
          type="password"
          placeholder="비밀번호 / 密码"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-name"
          placeholder="이름 / 姓名"
          class="w-full border rounded-2xl px-5 py-4"
        >

        ${
          currentMode === "driver"
          ? `
            <input
              id="signup-car"
              placeholder="차종 / 车型"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-car-number"
              placeholder="차량 번호 / 车牌号码"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="signup-driver-image"
              placeholder="프로필 사진 URL / 照片链接"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <textarea
              id="signup-driver-intro"
              placeholder="기사 소개글 / 司机介绍"
              class="w-full border rounded-2xl px-5 py-4 h-32"
            ></textarea>
          `
          : ""
        }

        <button
          onclick="signup()"
          class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg"
        >
          회원가입 완료
          <div class="text-xs text-gray-200 font-normal">
            注册完成
          </div>
        </button>

      </div>

    </div>
  `;
}

function signup() {

  const id =
    document.getElementById("signup-id").value.trim();

  const password =
    document.getElementById("signup-password").value.trim();

  const name =
    document.getElementById("signup-name").value.trim();

  if (!id || !password || !name) {

    alert("모든 항목을 입력해주세요.");

    return;
  }

  users.push({
    id,
    password,
    name,
    type: currentMode,
    car:
      document.getElementById("signup-car")
      ? document.getElementById("signup-car").value
      : "",
    carNumber:
      document.getElementById("signup-car-number")
      ? document.getElementById("signup-car-number").value
      : "",
    driverImage:
      document.getElementById("signup-driver-image")
      ? document.getElementById("signup-driver-image").value
      : "",
    driverIntro:
      document.getElementById("signup-driver-intro")
      ? document.getElementById("signup-driver-intro").value
      : "",
    rating: 5
  });

  currentUser = {
    id,
    name,
    type: currentMode
  };

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function login() {

  const id =
    document.getElementById("login-id").value.trim();

  const password =
    document.getElementById("login-password").value.trim();

  const matched =
    users.find(
      user =>
        user.id === id &&
        user.password === password &&
        user.type === currentMode
    );

  if (!matched) {

    alert("회원가입된 계정만 로그인 가능합니다.");

    return;
  }

  currentUser = matched;

  if (currentMode === "customer") {

    renderCustomer();

  } else {

    renderDriver();

  }
}

function showSuggestions(type) {

  const value =
    document.getElementById(type).value.toLowerCase();

  const list =
    document.getElementById(type + "-list");

  if (!value) {

    list.innerHTML = "";

    return;
  }

  const matched =
    locations.filter(location =>
      location.toLowerCase().includes(value)
    );

  list.innerHTML =
    matched.map(location => `
      <div
        onclick="selectLocation('${type}','${location}')"
        class="px-4 py-3 hover:bg-gray-100 cursor-pointer"
      >
        📍 ${location}
      </div>
    `).join("");
}

function selectLocation(type, location) {

  document.getElementById(type).value = location;

  document.getElementById(type + "-list").innerHTML = "";
}

function reserveRide() {

  const departure =
    document.getElementById("departure").value.trim();

  const destination =
    document.getElementById("destination").value.trim();

  const date =
    document.getElementById("ride-date").value;

  const time =
    document.getElementById("ride-time").value;

  reservations.push({
    id: Date.now(),
    customer: currentUser.name,
    departure,
    destination,
    date,
    time,
    estimatedPrice:
      Math.floor(Math.random() * 50000) + 30000,
    offers: [],
    matched: false
  });

  alert("예약 요청 완료!");

  renderCustomer();
}

function renderCustomer() {

  let mapUrl =
    "https://maps.google.com/maps?q=인천국제공항&output=embed";

  const latestReservation =
    reservations[reservations.length - 1];

  if (latestReservation) {

    mapUrl =
      "https://www.google.com/maps/dir/" +
      encodeURIComponent(
        latestReservation.departure
      ) +
      "/" +
      encodeURIComponent(
        latestReservation.destination
      );

  }

  document.getElementById("app").innerHTML = `
    <div class="p-6">

      <div class="max-w-7xl mx-auto bg-white rounded-[32px] shadow-xl p-8">

        <div class="flex justify-between items-center mb-10">

          <div>

            <h1 class="text-5xl font-bold">
              Incheon Mobility
            </h1>

            <p class="text-gray-500 mt-3 text-lg">
              프리미엄 공항 이동 서비스
              <div class="text-sm text-gray-400 mt-1">
                高级机场出行服务
              </div>
            </p>

          </div>

        </div>

        <div class="grid lg:grid-cols-2 gap-8">

          <div class="space-y-6">

            <div class="bg-gray-50 rounded-[28px] p-6">

              <h2 class="text-2xl font-bold mb-5">
                차량 호출
                <div class="text-sm text-gray-400 mt-1 font-normal">
                  呼叫车辆
                </div>
              </h2>

              <div class="space-y-4">

                <div class="relative">

                  <input
                    id="departure"
                    placeholder="출발지 입력 / 输入出发地"
                    onkeyup="showSuggestions('departure')"
                    class="w-full border rounded-2xl px-5 py-4"
                  >

                  <div
                    id="departure-list"
                    class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl overflow-hidden z-20"
                  ></div>

                </div>

                <div class="relative">

                  <input
                    id="destination"
                    placeholder="목적지 입력 / 输入目的地"
                    onkeyup="showSuggestions('destination')"
                    class="w-full border rounded-2xl px-5 py-4"
                  >

                  <div
                    id="destination-list"
                    class="absolute left-0 right-0 bg-white border rounded-2xl shadow-xl overflow-hidden z-20"
                  ></div>

                </div>

                <div class="grid grid-cols-2 gap-4">

                  <input
                    id="ride-date"
                    type="date"
                    class="border rounded-2xl px-5 py-4"
                  >

                  <input
                    id="ride-time"
                    type="time"
                    class="border rounded-2xl px-5 py-4"
                  >

                </div>

                <button
                  onclick="reserveRide()"
                  class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg"
                >
                  전체 기사 호출
                  <div class="text-xs text-gray-300 font-normal">
                    呼叫全部司机
                  </div>
                </button>

              </div>

            </div>

            <div class="bg-white border rounded-[28px] p-6">

              <div class="flex items-center justify-between mb-6">

                <h3 class="text-2xl font-bold">
                  추천 기사님
                  <div class="text-sm text-gray-400 mt-1 font-normal">
                    推荐司机
                  </div>
                </h3>

              </div>

              ${
                users
                  .filter(user => user.type === "driver")
                  .map(driver => `
                    <div class="border rounded-[28px] p-5 mb-5">

                      <div class="flex items-start gap-4">

                        <img
                          src="${
                            driver.driverImage ||
                            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
                          }"
                          class="w-20 h-20 rounded-full object-cover border"
                        >

                        <div class="flex-1">

                          <div class="flex items-center gap-2">

                            <p class="font-bold text-xl">
                              ${driver.name}
                            </p>

                            <span class="text-yellow-500 font-bold">
                              ⭐ ${driver.rating}
                            </span>

                          </div>

                          <p class="text-gray-500 mt-1">
                            ${driver.car}
                            ·
                            ${driver.carNumber}
                          </p>

                          <p class="text-gray-700 mt-3">
                            ${
                              driver.driverIntro ||
                              "안전하고 편안한 이동을 제공합니다."
                            }
                          </p>

                          <div class="mt-4 bg-gray-50 rounded-2xl p-3">

                            <p class="text-xs text-gray-400 mb-1">
                              최근 후기
                              ·
                              最新评价
                            </p>

                            <p class="text-sm text-gray-700">
                              “친절하시고 운전이 정말 편했어요.”
                            </p>

                          </div>

                        </div>

                      </div>

                    </div>
                  `).join("")
              }

            </div>

          </div>

          <div class="rounded-[28px] overflow-hidden border h-[700px]">

            <iframe
              src="${mapUrl}"
              class="w-full h-full"
            ></iframe>

          </div>

        </div>

      </div>

    </div>
  `;
}

function renderDriver() {

  document.getElementById("app").innerHTML = `
    <div class="p-10 text-3xl font-bold">
      기사 페이지
      <div class="text-base text-gray-400 font-normal mt-2">
        司机页面
      </div>
    </div>
  `;
}

renderHome();

</script>

</body>
</html>
