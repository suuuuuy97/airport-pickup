<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Incheon Mobility</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div id="app"></div>

<script>
let currentMode = null;
let currentUser = null;

let users = [];
let reservation = null;

const drivers = [
  {
    name: "김기사",
    car: "K8 블랙",
    eta: "5분",
    image:
      "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
  },
  {
    name: "박드라이버",
    car: "카니발 하이리무진",
    eta: "8분",
    image:
      "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=400&auto=format&fit=crop"
  }
];

function renderHome() {
  document.getElementById("app").innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-6">

      <div class="w-full max-w-6xl grid md:grid-cols-2 gap-6">

        <div
          onclick="selectMode('customer')"
          class="cursor-pointer bg-white rounded-3xl p-10 shadow-xl hover:scale-[1.02] transition-all"
        >
          <div class="text-7xl mb-6">🧳</div>

          <h2 class="text-4xl font-bold">
            고객용
          </h2>

          <p class="text-gray-500 mt-4 text-lg">
            공항 픽업 예약 및 기사 호출
          </p>
        </div>

        <div
          onclick="selectMode('driver')"
          class="cursor-pointer bg-white rounded-3xl p-10 shadow-xl hover:scale-[1.02] transition-all"
        >
          <div class="text-7xl mb-6">🚖</div>

          <h2 class="text-4xl font-bold">
            기사용
          </h2>

          <p class="text-gray-500 mt-4 text-lg">
            운행 관리 및 수익 확인
          </p>
        </div>

        <div id="auth-area" class="md:col-span-2"></div>

      </div>

    </div>
  `;
}

function selectMode(mode) {
  currentMode = mode;

  document.getElementById("auth-area").innerHTML = `
    <div class="bg-white rounded-3xl shadow-2xl p-10 mt-2">

      <h2 class="text-3xl font-bold mb-8">
        ${mode === "customer" ? "고객 로그인" : "기사 로그인"}
      </h2>

      <div class="space-y-4">

        <input
          id="login-id"
          placeholder="아이디"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="login-password"
          type="password"
          placeholder="비밀번호"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <button
          onclick="login()"
          class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg"
        >
          로그인
        </button>

        <button
          onclick="showSignup()"
          class="w-full border border-black py-4 rounded-2xl font-bold text-lg"
        >
          회원가입 하기
        </button>

      </div>

    </div>
  `;
}

function showSignup() {
  document.getElementById("auth-area").innerHTML += `
    <div class="bg-white rounded-3xl shadow-2xl p-10 mt-6">

      <h2 class="text-3xl font-bold mb-8">
        회원가입
      </h2>

      <div class="space-y-4">

        <input
          id="signup-id"
          placeholder="${currentMode === "customer" ? "고객 아이디" : "기사 아이디"}"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-password"
          type="password"
          placeholder="비밀번호"
          class="w-full border rounded-2xl px-5 py-4"
        >

        <input
          id="signup-name"
          placeholder="${currentMode === "customer" ? "고객 이름" : "기사 이름"}"
          class="w-full border rounded-2xl px-5 py-4"
        >

        ${
          currentMode === "driver"
          ? `
            <input
              id="signup-car"
              placeholder="차종"
              class="w-full border rounded-2xl px-5 py-4"
            >
          `
          : ""
        }

        <button
          onclick="signup()"
          class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg"
        >
          회원가입 완료
        </button>

      </div>

    </div>
  `;
}

function signup() {
  const id = document.getElementById("signup-id").value.trim();
  const password = document.getElementById("signup-password").value.trim();
  const name = document.getElementById("signup-name").value.trim();

  if (!id || !password || !name) {
    alert("모든 항목을 입력해주세요.");
    return;
  }

  const exists = users.find(user => user.id === id);

  if (exists) {
    alert("이미 존재하는 아이디입니다.");
    return;
  }

  users.push({
    id,
    password,
    name,
    type: currentMode
  });

  alert("회원가입 완료!");

  currentUser = {
    id,
    name,
    type: currentMode
  };

  if (currentMode === "customer") {
    renderCustomer();
  } else {
    renderDriver();
  }
}

function login() {
  const id = document.getElementById("login-id").value.trim();
  const password = document.getElementById("login-password").value.trim();

  if (!id || !password) {
    alert("아이디와 비밀번호를 입력해주세요.");
    return;
  }

  const matched = users.find(
    user =>
      user.id === id &&
      user.password === password &&
      user.type === currentMode
  );

  if (!matched) {
    alert("회원가입된 계정만 로그인 가능합니다.");
    return;
  }

  currentUser = matched;

  if (currentMode === "customer") {
    renderCustomer();
  } else {
    renderDriver();
  }
}

function reserveRide() {
  const departure =
    document.getElementById("departure").value.trim();

  const destination =
    document.getElementById("destination").value.trim();

  const date =
    document.getElementById("date").value;

  const time =
    document.getElementById("time").value;

  if (!departure || !destination) {
    alert("출발지와 목적지를 입력해주세요.");
    return;
  }

  const assignedDriver =
    drivers[Math.floor(Math.random() * drivers.length)];

  reservation = {
    customer: currentUser.name,
    departure,
    destination,
    date,
    time,
    driver: assignedDriver,
    accepted: false
  };

  alert(
    assignedDriver.name + " 기사님이 배정되었습니다."
  );

  renderCustomer();
}

function renderCustomer() {

  let mapUrl = "https://maps.google.com/maps?q=인천국제공항&output=embed";

  if (reservation) {
    mapUrl =
      "https://www.google.com/maps?q=" +
      encodeURIComponent(
        reservation.departure + " " + reservation.destination
      ) +
      "&output=embed";
  }

  document.getElementById("app").innerHTML = `
    <div class="p-6">

      <div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-xl p-8">

        <div class="flex justify-between items-center mb-8">

          <div>
            <h1 class="text-4xl font-bold">
              Incheon Mobility
            </h1>

            <p class="text-gray-500 mt-2">
              공항 · 시내 프리미엄 이동 플랫폼
            </p>
          </div>

          <button
            onclick="logout()"
            class="bg-gray-200 px-5 py-3 rounded-2xl font-bold"
          >
            로그아웃
          </button>

        </div>

        <div class="grid lg:grid-cols-2 gap-6">

          <div class="space-y-5">

            <input
              id="departure"
              placeholder="출발지 입력"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="destination"
              placeholder="목적지 입력"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="date"
              type="date"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <input
              id="time"
              type="time"
              class="w-full border rounded-2xl px-5 py-4"
            >

            <button
              onclick="reserveRide()"
              class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg"
            >
              예약금 결제 후 예약하기
            </button>

            ${
              reservation
              ? `
                <div class="bg-green-50 border-2 border-green-500 rounded-3xl p-5">

                  <div class="flex items-center gap-4">

                    <img
                      src="${reservation.driver.image}"
                      class="w-20 h-20 rounded-full object-cover"
                    >

                    <div>

                      <h3 class="text-2xl font-bold">
                        ${reservation.driver.name}
                      </h3>

                      <p class="text-gray-500 mt-1">
                        ${reservation.driver.car}
                      </p>

                      <p class="text-green-600 font-bold mt-2">
                        기사 배정 완료
                      </p>

                    </div>

                  </div>

                </div>
              `
              : ""
            }

          </div>

          <div class="rounded-3xl overflow-hidden border h-[700px] relative">

            <iframe
              src="${mapUrl}"
              class="w-full h-full"
            ></iframe>

            ${
              reservation
              ? `
                <div class="absolute bottom-6 left-6 right-6 bg-white rounded-3xl shadow-xl p-5">

                  <div class="flex justify-between items-center">

                    <div>

                      <p class="font-bold text-xl">
                        ${reservation.driver.name} 기사 이동중
                      </p>

                      <p class="text-gray-500 mt-1">
                        ${reservation.departure}
                        →
                        ${reservation.destination}
                      </p>

                    </div>

                    <div class="text-right">

                      <p class="text-gray-500 text-sm">
                        도착 예정
                      </p>

                      <p class="text-2xl font-bold text-green-600">
                        ${reservation.driver.eta}
                      </p>

                    </div>

                  </div>

                </div>
              `
              : ""
            }

          </div>

        </div>

      </div>

    </div>
  `;
}

function acceptReservation() {
  reservation.accepted = true;

  alert("예약을 승낙했습니다.");

  renderDriver();
}

function renderDriver() {
  document.getElementById("app").innerHTML = `
    <div class="p-6">

      <div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-xl p-8">

        <div class="flex justify-between items-center mb-8">

          <div>
            <h1 class="text-4xl font-bold">
              기사 대시보드
            </h1>

            <p class="text-gray-500 mt-2">
              운행 관리 및 수익 확인
            </p>
          </div>

          <button
            onclick="logout()"
            class="bg-gray-200 px-5 py-3 rounded-2xl font-bold"
          >
            로그아웃
          </button>

        </div>

        <div class="grid lg:grid-cols-2 gap-6">

          <div class="space-y-5">

            <div class="bg-gray-50 rounded-3xl p-6">

              <p class="text-gray-500">
                오늘 수익
              </p>

              <h2 class="text-5xl font-bold mt-2">
                ₩120,000
              </h2>

            </div>

            <div class="bg-gray-50 rounded-3xl p-6">

              <p class="text-gray-500">
                출금 가능 금액
              </p>

              <h2 class="text-5xl font-bold mt-2">
                ₩845,000
              </h2>

              <button
                class="w-full mt-6 bg-black text-white py-4 rounded-2xl font-bold"
              >
                내 계좌로 출금하기
              </button>

            </div>

          </div>

          <div class="bg-gray-50 rounded-3xl p-6">

            <h3 class="text-2xl font-bold mb-6">
              신규 예약 요청
            </h3>

            ${
              reservation
              ? `
                <div class="bg-white rounded-3xl p-5 border-2 border-yellow-400">

                  <p class="font-bold text-xl">
                    ${reservation.customer} 고객
                  </p>

                  <p class="text-gray-500 mt-2">
                    ${reservation.departure}
                    →
                    ${reservation.destination}
                  </p>

                  <p class="text-gray-500 mt-2">
                    ${reservation.date}
                    ·
                    ${reservation.time}
                  </p>

                  ${
                    !reservation.accepted
                    ? `
                      <button
                        onclick="acceptReservation()"
                        class="w-full mt-6 bg-green-600 text-white py-4 rounded-2xl font-bold"
                      >
                        승낙하기
                      </button>
                    `
                    : `
                      <div class="mt-6 bg-green-50 border-2 border-green-500 rounded-2xl p-4">

                        <p class="font-bold text-green-700">
                          예약 승낙 완료
                        </p>

                        <p class="text-gray-600 mt-2">
                          고객 위치:
                          ${reservation.departure}
                        </p>

                      </div>
                    `
                  }

                </div>
              `
              : `
                <div class="text-gray-400">
                  현재 예약 요청이 없습니다.
                </div>
              `
            }

          </div>

        </div>

      </div>

    </div>
  `;
}

function logout() {
  currentMode = null;
  currentUser = null;

  renderHome();
}

renderHome();
</script>

</body>
</html>
